name: Agnix agent configuration guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agnix-static-guard:
    name: Pinned Agnix static guard (not native runtime proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false
      - name: Generate lock for review (temporary diagnostic)
        run: |
          mise lock
          python3 -c 'import base64,pathlib; print("AGNIX_MISE_LOCK_B64="+base64.b64encode(pathlib.Path("mise.lock").read_bytes()).decode())'
          find .mise/locks -type f -maxdepth 5 -print || true
          mise install --locked
      - name: Guard negative witnesses and bounded real-code verdict invariants
        run: mise exec -- python -m unittest discover -s tests -p 'test_agnix_guard.py' -v
      - name: Check reviewed scope and tool pin
        run: mise exec -- python scripts/agnix_guard.py --check-policy
      - name: Run bounded verdict model and failing mutant
        run: mise exec -- python scripts/agnix_guard.py --formal
      - name: Lint active agent configs with pinned Agnix
        run: mise exec -- python scripts/agnix_guard.py
