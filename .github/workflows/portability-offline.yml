name: Portable offline contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    name: Python contracts (no host CLIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install test dependencies
        run: |
          uv sync --frozen
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
      - name: Validate poteto-mode scripts and execution plans
        run: |
          (cd skills/poteto-mode/scripts && bun install --frozen-lockfile)
          bun skills/poteto-mode/scripts/check-plan.mjs docs/plans/2026-11-07-reproducible-runtime-and-verification.md
          bun test skills/poteto-mode/scripts/
      - name: Validate hermetic doctor fixture (offline, no host CLIs)
        # #709/#717: the two fixture-HOME doctor cases — the regression that keeps
        # ambient plugin mirrors from deciding the doctor verdict, plus its
        # fail-closed seed-install case. Pure Python subprocess work, ~20s.
        # Deliberately referenced with `working-directory` instead of a `tests/…`
        # path: the rest of this module needs host CLIs, so it must not register
        # as an offline gate module in select_checks' workflow scan.
        working-directory: tests
        run: uv run pytest -q test_verify_portable.py -k "hermetic or fixture_install_fails"
      - name: Validate portability and safety contracts
        run: |
          uv run pytest -q \
            tests/test_portability_schemas.py \
            tests/test_runtime_toolchain.py \
            tests/test_pi_candidate_profile.py \
            tests/test_host_identity.py \
            tests/test_model_role_schema.py \
            tests/test_model_role_constraints.py \
            tests/test_model_role_profiles.py \
            tests/test_droid_integration.py \
            tests/test_droid_routing.py \
            tests/test_route_resolver.py \
            tests/test_verdict_reduction.py \
            tests/test_harness_drivers.py \
            tests/test_omp_rpc.py \
            tests/test_omp_rpc_cancel.py \
            tests/test_project_package.py \
            tests/test_skill_frontmatter.py \
            tests/test_scan_host_boundary.py \
            tests/test_setup_projection.py \
            tests/test_package_lifecycle.py \
            tests/test_package_lifecycle_safety.py \
            tests/test_evidence_durability.py \
            tests/test_evidence_refresh_static.py \
            tests/test_surface_cache.py \
            tests/test_evidence_settlement.py \
            tests/test_evidence_cancellation.py \
            tests/test_evidence_index_resilience.py \
            tests/test_evidence_receipts.py \
            tests/test_select_checks.py \
            tests/test_scaffold_verification_skill.py \
            tests/test_sync_antigravity_plugin.py \
            tests/test_omp_native_package.py \
            tests/test_ci_resource_isolation.py \
            tests/test_playbook_parity.py \
            tests/test_shipping_safety.py \
            tests/test_review_effect_contracts.py \
            tests/test_context_overlays.py \
            tests/test_context_budget_contracts.py \
            tests/test_eval_blinded_pstack_dsh_candidate.py \
            tests/test_eval_blinded_pstack_dsh.py \
            tests/test_canonical_index.py \
            tests/test_upstream_pstack_01536.py \
            tests/test_worktree_protocol.py
      - name: Validate Pi candidate source-only skills and bounded model
        run: |
          uv run python scripts/verify_pi_candidate.py check
          uv run python scripts/verify_pi_candidate.py model
          uv run python scripts/scaffold_verification_skill.py --check --target-dir .pi/skills/verify-pi-pstack
        # This does not run Pi or certify child, sandbox or permission behavior.
      - name: Validate worktree confinement protocol
        run: uv run python scripts/worktree_protocol.py check
      - name: Validate documentation and offline JEV decision contracts
        run: |
          uv run pytest -q \
            tests/test_architecture_documentation.py \
            tests/test_decision_bounded_invariants.py \
            tests/test_paid_budget_concurrency.py \
            tests/test_decision_adapter.py \
            tests/test_jev_transport_and_profiles.py \
            tests/test_advisory_promotion.py \
            tests/test_shadow_routing.py \
            tests/test_class_calibration_policy.py \
            tests/test_rollback_equivalence.py \
            tests/test_verify_decision_contract.py \
            tests/test_eval_decision_routing.py \
            tests/test_jev_privacy_and_bypass.py \
            tests/test_jev_mapping_and_calibrated_evidence.py \
            tests/test_fast_role_task_fit.py
      - name: Verify project-local LLM Wiki source safety and bounded model
        run: |
          uv run python scripts/scaffold_verification_skill.py --check --target-dir .codex/skills/verify-llm-wiki
          bash .codex/skills/verify-llm-wiki/scripts/driver.sh launch
          bash .codex/skills/verify-llm-wiki/scripts/driver.sh drive
        # Bounded actual-code and negative mutation checks only.
        # TLC, upstream SDK/binary, models and host-native live runs remain UNTESTED.
      - name: Verify maintained JEV skill doctor on exact PR head
        run: |
          bash .codex/skills/verify-decision-contract/scripts/driver.sh launch
          bash .codex/skills/verify-decision-contract/scripts/driver.sh doctor
        # This validates only hermetic bounded checks. Upstream commit/tree
        # captures, native hosts, and authenticated providers remain UNTESTED.
      - name: Verify project-local formal LLM Wiki model driver
        run: |
          uv run python scripts/scaffold_verification_skill.py --check --target-dir .codex/skills/verify-llm-wiki-formal
          bash .codex/skills/verify-llm-wiki-formal/scripts/driver.sh launch
          bash .codex/skills/verify-llm-wiki-formal/scripts/driver.sh doctor
        # Bounded actual-code formal checks only.
      - name: Verify Antigravity verification skill driver
        run: |
          uv run python scripts/scaffold_verification_skill.py --check --target-dir .agents/skills/verify-antigravity-pstack
          bash .agents/skills/verify-antigravity-pstack/scripts/driver.sh launch
          bash .agents/skills/verify-antigravity-pstack/scripts/driver.sh drive
        # Hermetic environment readiness and four-plane evidence contracts.
      - name: Audit all verification skills across harnesses
        run: uv run python scripts/scaffold_verification_skill.py --audit --json
      - name: Validate checked-in model policy against canonical role registry
        run: uv run python -m scripts.model_role_policy
      # Native host spawn/join/isolation are intentionally NOT covered here.
      # Their separate live evidence lives in .audit/evidence/ receipts and profiles/*.json bindings.
