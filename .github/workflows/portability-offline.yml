name: Portable offline contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    name: Python contracts (no host CLIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate portability and safety contracts
        run: |
          python -m pytest -q \
            tests/test_portability_schemas.py \
            tests/test_droid_integration.py \
            tests/test_droid_routing.py \
            tests/test_route_resolver.py \
            tests/test_verdict_reduction.py \
            tests/test_harness_drivers.py \
            tests/test_omp_rpc.py \
            tests/test_project_package.py \
            tests/test_skill_frontmatter.py \
            tests/test_scan_host_boundary.py \
            tests/test_package_lifecycle.py \
            tests/test_package_lifecycle_safety.py \
            tests/test_evidence_durability.py \
            tests/test_evidence_receipts.py \
            tests/test_select_checks.py \
            tests/test_sync_antigravity_plugin.py \
            tests/test_omp_native_package.py \
            tests/test_ci_resource_isolation.py \
            tests/test_playbook_parity.py \
            tests/test_review_effect_contracts.py \
            tests/test_context_overlays.py \
            tests/test_context_budget_contracts.py \
            tests/test_eval_blinded_pstack_dsh_candidate.py \
            tests/test_eval_blinded_pstack_dsh.py \
            tests/test_canonical_index.py
      # Native host spawn/join/isolation are intentionally NOT covered here.
      # Their separate live evidence is tracked by issues #238 and #240.
