[settings]
lockfile = true

[tools]
bun = "1.4.4"
python = "3.12"
uv = "0.13.7"

[tasks."test"]
description = "Run full test suite via uv"
run = "uv run pytest"

[tasks."test:offline"]
description = "Run offline contract pytest suite"
run = "uv run pytest tests/test_portability_schemas.py tests/test_runtime_toolchain.py tests/test_pi_candidate_profile.py tests/test_host_identity.py tests/test_model_role_schema.py tests/test_model_role_constraints.py tests/test_model_role_profiles.py tests/test_droid_integration.py tests/test_droid_routing.py tests/test_route_resolver.py tests/test_verdict_reduction.py tests/test_harness_drivers.py tests/test_omp_rpc.py tests/test_omp_rpc_cancel.py tests/test_project_package.py tests/test_skill_frontmatter.py tests/test_scan_host_boundary.py tests/test_setup_projection.py tests/test_package_lifecycle.py tests/test_package_lifecycle_safety.py tests/test_evidence_durability.py tests/test_evidence_refresh_static.py tests/test_surface_cache.py tests/test_evidence_settlement.py tests/test_evidence_cancellation.py tests/test_evidence_index_resilience.py tests/test_evidence_receipts.py tests/test_select_checks.py tests/test_scaffold_verification_skill.py tests/test_sync_antigravity_plugin.py tests/test_omp_native_package.py tests/test_ci_resource_isolation.py tests/test_playbook_parity.py tests/test_shipping_safety.py tests/test_review_effect_contracts.py tests/test_context_overlays.py tests/test_context_budget_contracts.py tests/test_eval_blinded_pstack_dsh_candidate.py tests/test_eval_blinded_pstack_dsh.py tests/test_canonical_index.py tests/test_upstream_pstack_01536.py tests/test_worktree_protocol.py tests/test_antigravity_command_projection.py tests/test_droid_projection.py tests/test_thermos_skills.py tests/test_worktree_cleanup.py tests/test_verification_skill_templates.py tests/test_verify_harness.py tests/test_pi_authorization_contracts.py tests/test_harness_profiles_sync.py tests/test_interrogate_pack.py tests/test_swarm_apply.py tests/test_swarm_partition.py tests/test_print_coverage_decoy_nested.py tests/test_plugin_agents.py tests/test_principle_test_behavior.py tests/test_type_annotations_hygiene.py tests/test_executable_lookup.py tests/test_absorbed_intent.py tests/test_architecture_documentation.py tests/test_decision_bounded_invariants.py tests/test_paid_budget_concurrency.py tests/test_decision_adapter.py tests/test_jev_transport_and_profiles.py tests/test_advisory_promotion.py tests/test_shadow_routing.py tests/test_class_calibration_policy.py tests/test_rollback_equivalence.py tests/test_verify_decision_contract.py tests/test_eval_decision_routing.py tests/test_jev_privacy_and_bypass.py tests/test_jev_mapping_and_calibrated_evidence.py tests/test_fast_role_task_fit.py"

[tasks."test:scripts"]
description = "Run poteto-mode and statechart tool tests via bun"
run = "bun test --timeout 30000 --cwd skills/poteto-mode/scripts && bun test --cwd skills/statechart/scripts"

[tasks."plan:check"]
description = "Validate all execution plans via check-plan script"
run = "bun skills/poteto-mode/scripts/check-plan.mjs docs/plans/*.md"

[tasks."verify:portable"]
description = "Verify portable evidence durability across all hosts"
run = "uv run python scripts/verify_portable.py check-evidence --host all"

[tasks."verify:lifecycle"]
description = "Verify package lifecycle across all hosts"
run = "uv run python scripts/package_lifecycle.py verify --host all"

[tasks."verify:sync"]
description = "Verify live Antigravity plugin synchronization"
run = "uv run python scripts/sync_antigravity_plugin.py --check"

[tasks."verify:canonical"]
description = "Verify canonical inventory and conformance"
run = "uv run python scripts/canonical_index.py --check || [ $? -eq 2 ]"

[tasks."verify:doctor"]
description = "Run 6-harness doctor matrix across all hosts"
run = "uv run python scripts/verify_portable.py doctor --host all"

[tasks."verify:staleness"]
description = "Verify static evidence staleness across all hosts"
run = "uv run python scripts/verify_portable.py check-staleness --host all"

[tasks."verify:projection"]
description = "Verify package manifest and model projections across hosts"
run = "uv run python scripts/package_projection.py --check"

[tasks."verify:skills"]
description = "Audit all verification skills across harnesses"
run = "uv run python scripts/scaffold_verification_skill.py --audit --json"

[tasks."verify:doctor:skills"]
description = "Execute doctor command across all 10 verification drivers"
run = "uv run python scripts/scaffold_verification_skill.py --doctor-all"

[tasks."verify:cleanup:skills"]
description = "Execute cleanup command across all 10 verification drivers"
run = "uv run python scripts/scaffold_verification_skill.py --cleanup-all"

[tasks."verify:drivers"]
description = "Execute launch and drive across all 10 verification drivers"
run = "uv run python scripts/scaffold_verification_skill.py --drive-all"

[tasks."openspec:status"]
description = "Inspect active intent-driven OpenSpec planning flow status"
run = "openspec status --all"

[tasks."validate:openspec"]
description = "Run dual-mode OpenSpec validation (all specs and strict active changes)"
run = "openspec validate --all && openspec validate --changes --strict"

[tasks."validate:openspec:all"]
description = "Validate all living OpenSpec specifications and schemas"
run = "openspec validate --all"

[tasks."validate:openspec:changes"]
description = "Strictly validate active OpenSpec change proposals"
run = "openspec validate --changes --strict"

[tasks."verify:openspec"]
description = "Run dual-mode OpenSpec validation (all specs and strict active changes)"
run = "openspec validate --all && openspec validate --changes --strict"

[tasks."verify:openspec:all"]
description = "Validate all living OpenSpec specifications and schemas"
run = "openspec validate --all"

[tasks."verify:openspec:changes"]
description = "Strictly validate active OpenSpec change proposals"
run = "openspec validate --changes --strict"

[tasks."worktree:check"]
description = "Validate worktree confinement protocol"
run = "uv run python scripts/worktree_protocol.py check"

[tasks."worktree:audit"]
description = "Audit registered and leftover worktrees"
run = "bash skills/poteto-mode/scripts/worktree-audit.sh"
