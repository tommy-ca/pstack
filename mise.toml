[settings]
lockfile = true

[tools]
bun = "1.4.4"
python = "3.12"
uv = "0.13.7"

[tasks."test"]
description = "Run full test suite via uv"
run = "uv run pytest"

[tasks."test:offline"]
description = "Run offline contract pytest suite"
run = "uv run pytest tests/test_portability_schemas.py tests/test_pi_candidate_profile.py tests/test_host_identity.py tests/test_model_role_schema.py tests/test_model_role_constraints.py tests/test_model_role_profiles.py tests/test_droid_integration.py tests/test_droid_routing.py tests/test_route_resolver.py tests/test_verdict_reduction.py tests/test_harness_drivers.py tests/test_omp_rpc.py tests/test_omp_rpc_cancel.py tests/test_project_package.py tests/test_skill_frontmatter.py tests/test_scan_host_boundary.py tests/test_setup_projection.py tests/test_package_lifecycle.py tests/test_package_lifecycle_safety.py tests/test_evidence_durability.py tests/test_evidence_refresh_static.py tests/test_surface_cache.py tests/test_evidence_settlement.py tests/test_evidence_cancellation.py tests/test_evidence_index_resilience.py tests/test_evidence_receipts.py tests/test_select_checks.py tests/test_scaffold_verification_skill.py tests/test_sync_antigravity_plugin.py tests/test_ci_resource_isolation.py tests/test_playbook_parity.py tests/test_shipping_safety.py tests/test_review_effect_contracts.py tests/test_context_overlays.py tests/test_context_budget_contracts.py tests/test_eval_blinded_pstack_dsh_candidate.py tests/test_eval_blinded_pstack_dsh.py tests/test_canonical_index.py tests/test_upstream_pstack_01536.py tests/test_worktree_protocol.py"

[tasks."test:scripts"]
description = "Run poteto-mode tool tests via bun"
run = "bun test --timeout 30000 --cwd skills/poteto-mode/scripts"

[tasks."verify:portable"]
description = "Verify portable evidence durability across all hosts"
run = "uv run python scripts/verify_portable.py check-evidence --host all"

[tasks."verify:lifecycle"]
description = "Verify package lifecycle across all hosts"
run = "uv run python scripts/package_lifecycle.py verify --host all"

[tasks."verify:sync"]
description = "Verify live Antigravity plugin synchronization"
run = "uv run python scripts/sync_antigravity_plugin.py --check"

[tasks."verify:canonical"]
description = "Verify canonical inventory and conformance"
run = "uv run python scripts/canonical_index.py --check || [ $? -eq 2 ]"
